version: 2

project_name: nether

env:
    - CGO_ENABLED=0

builds:
    - main: ./cmd/nether
      binary: nether
      ldflags:
          - -s -w -X github.com/madhukraft/nether/internal/cmd.Version={{ .Version }}
      goos:
          - linux
          - darwin
          - windows
      goarch:
          - amd64
          - arm64

archives:
    - formats: ["binary"]
      name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
    name_template: checksums.txt

snapshot:
    version_template: "{{ .Tag }}-next"

release:
    footer: |-
        ### Docker

        ```sh
        docker pull ghcr.io/madhukraft/nether:{{ .Tag }}
        ```

changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"

dockers_v2:
    - images:
          - ghcr.io/madhukraft/nether
          - madhukraft/nether
      tags:
          - "{{ .Version }}"
          - latest
      dockerfile: Dockerfile.goreleaser
      platforms:
          - linux/amd64
          - linux/arm64
      labels:
          "org.opencontainers.image.title": "{{ .ProjectName }}"
          "org.opencontainers.image.description": "Nether - Minecraft server setup tool"
          "org.opencontainers.image.url": "https://github.com/madhukraft/nether"
          "org.opencontainers.image.source": "https://github.com/madhukraft/nether"
          "org.opencontainers.image.version": "{{ .Version }}"
          "org.opencontainers.image.revision": "{{ .FullCommit }}"
          "org.opencontainers.image.licenses": "MIT"

nfpms:
    - package_name: nether
      homepage: "https://github.com/madhukraft/nether"
      description: "Nether - Minecraft server setup tool"
      maintainer: "Madhukraft"
      license: "MIT"
      formats:
          - deb
          - rpm
          - archlinux
