version: 2

project_name: nether

before:
    hooks:
        - sh -c "mkdir -p completions && go run ./cmd/nether completion bash > completions/nether.bash && go run ./cmd/nether completion zsh > completions/nether.zsh && go run ./cmd/nether completion fish > completions/nether.fish"

env:
    - CGO_ENABLED=0

builds:
    - id: unix
      main: ./cmd/nether
      binary: nether
      ldflags:
          - -s -w -X github.com/madhukraft/nether/internal/cmd.Version={{ .Version }}
      goos:
          - linux
          - darwin
      goarch:
          - amd64
          - arm64
    - id: windows
      main: ./cmd/nether
      binary: nether
      ldflags:
          - -s -w -X github.com/madhukraft/nether/internal/cmd.Version={{ .Version }}
      goos:
          - windows
      goarch:
          - amd64
    - id: windows-exe
      main: ./cmd/nether
      binary: nether
      ldflags:
          - -s -w -X github.com/madhukraft/nether/internal/cmd.Version={{ .Version }}
      goos:
          - windows
      goarch:
          - amd64
    - id: windows-arm64
      main: ./cmd/nether
      binary: nether
      ldflags:
          - -s -w -X github.com/madhukraft/nether/internal/cmd.Version={{ .Version }}
      goos:
          - windows
      goarch:
          - arm64

archives:
    - formats: ["binary"]
      name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
      ids:
          - unix
          - windows-arm64
          - windows-exe
    - id: windows
      formats: ["zip"]
      name_template: "{{ .ProjectName }}-windows-{{ .Arch }}"
      ids:
          - windows

checksum:
    name_template: checksums.txt

snapshot:
    version_template: "{{ .Tag }}-next"

release:
    footer: |-
        ### Docker

        ```sh
        docker pull ghcr.io/madhukraft/nether:{{ .Tag }}
        ```

changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - "^ci:"
            - "^chore:"
            - "^refactor:"

dockers_v2:
    - images:
          - ghcr.io/madhukraft/nether
          - madhukraft/nether
      tags:
          - "{{ .Version }}"
          - latest
      dockerfile: Dockerfile.goreleaser
      platforms:
          - linux/amd64
          - linux/arm64
      labels:
          "org.opencontainers.image.title": "{{ .ProjectName }}"
          "org.opencontainers.image.description": "Nether - Minecraft server setup tool"
          "org.opencontainers.image.url": "https://github.com/madhukraft/nether"
          "org.opencontainers.image.source": "https://github.com/madhukraft/nether"
          "org.opencontainers.image.version": "{{ .Version }}"
          "org.opencontainers.image.revision": "{{ .FullCommit }}"
          "org.opencontainers.image.licenses": "MIT"

homebrew_casks:
    - name: nether
      repository:
          owner: madhukraft
          name: homebrew-tap
          token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      url:
          verified: github.com/madhukraft/nether
      description: "Nether - Minecraft server setup tool"
      homepage: "https://github.com/madhukraft/nether"
      license: "MIT"
      binaries:
          - nether
      skip_upload: false

scoops:
    - name: nether
      repository:
          owner: madhukraft
          name: scoop-bucket
          token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      description: "Nether - Minecraft server setup tool"
      homepage: "https://github.com/madhukraft/nether"
      license: "MIT"
      ids:
          - windows
      skip_upload: false

nfpms:
    - package_name: nether
      homepage: "https://github.com/madhukraft/nether"
      description: "Nether - Minecraft server setup tool"
      maintainer: "Madhukraft"
      license: "MIT"
      formats:
          - deb
          - rpm
          - archlinux
      contents:
          - src: completions/nether.bash
            dst: /usr/share/bash-completion/completions/nether
          - src: completions/nether.zsh
            dst: /usr/share/zsh/vendor-completions/_nether
          - src: completions/nether.fish
            dst: /usr/share/fish/vendor-completions/nether.fish
